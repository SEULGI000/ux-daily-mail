name: Daily UX/UI Mail

on:
  schedule:
    # 19:30 UTC = 한국시간 04:30. GitHub 지연을 대비해 넉넉히 미리 깨우고,
    # 아래 '06:00까지 대기' 단계가 정확히 06:00 KST에 발송한다.
    - cron: "30 19 * * *"
  workflow_dispatch: {}   # 수동 실행(즉시 발송 테스트용)

permissions:
  contents: write   # 보낸 글 기록(sent_history.json) 커밋/푸시를 위해 필요

jobs:
  send-mail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      # 예약 실행일 때만 06:00까지 대기 (수동 실행은 즉시 발송되어 테스트 편함)
      - name: Wait until 06:00 KST
        if: github.event_name == 'schedule'
        run: |
          python <<'PY'
          import time, datetime
          from zoneinfo import ZoneInfo
          kst = ZoneInfo("Asia/Seoul")
          now = datetime.datetime.now(kst)
          target = now.replace(hour=6, minute=0, second=0, microsecond=0)
          secs = (target - now).total_seconds()
          if secs > 0:
              print(f"{int(secs)}초 대기 후 06:00 KST 정각에 발송합니다.")
              time.sleep(secs)
          else:
              print("이미 06:00을 지나 즉시 발송합니다.")
          PY

      - name: Send mail
        env:
          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py

      # 이번에 보낸 글 기록을 저장소에 커밋 (다음날 같은 글을 피하기 위해)
      - name: Save sent history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_history.json
          git commit -m "chore: update sent history" || echo "변경 없음"
          git push || echo "푸시 생략"
